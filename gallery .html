<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Bikaner Sweets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #333; background: #fffaf0; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://source.unsplash.com/random/1600x900/?indian-sweets') center/cover; color: white; text-align: center; padding: 120px 20px 80px; }
        .logo { font-size: 2.8rem; font-weight: bold; color: #ffcc00; }
        nav { background: #8b4513; padding: 18px 0; position: sticky; top: 0; z-index: 100; }
        nav ul { list-style: none; display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; }
        nav a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: 500; }
        nav a:hover { color: #ffcc00; }
        section { padding: 100px 20px; max-width: 1100px; margin: 0 auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery img { width: 100%; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        footer { background: #222; color: #ddd; text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>

    <header><div class="logo">Bikaner Sweets</div></header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="menu.html">Our Sweets</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section>
        <h1 style="color:#8b4513; text-align:center; margin-bottom:50px;">Our Gallery</h1>
        <div class="gallery">
            <img src="https://source.unsplash.com/random/600x400/?indian-sweets" alt="Assorted Sweets">
            <img src="https://source.unsplash.com/random/600x400/?mithai-box" alt="Gift Packaging">
            <img src="https://source.unsplash.com/random/600x400/?festival-sweets" alt="Festival Collection">
            <img src="https://source.unsplash.com/random/600x400/?traditional-mithai" alt="Traditional Mithai">
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Bikaner Sweets • All Rights Reserved</p>
    </footer>

</body>
</html>
